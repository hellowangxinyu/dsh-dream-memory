# dsh-dream-memory bundle patch：安装时自动把本插件注册进 profile 的插件清单。
# 无需手动插入；安装后重启 dsh web 生效。
- insert:
    - id: dsh-dream-memory
      name: 'dsh-dream-memory'
      config:
        dbPath: !!js dshHomePath('dream-memory/memory.db')
        recallEnabled: true
        dreamEnabled: true
        legacyImport: true
        recallMaxNodes: 6
        recallMaxDepth: 1
        dreamInterval: 6
        minDreamMessages: 3
        identityMaxChars: 750
        recallMaxChars: 1500
        # 语义检索可选：设置环境变量后自动启用，未设置时使用 FTS5
        embedding:
          apiKeyEnv: !!js "process.env.DREAM_MEMORY_EMBEDDING_API_KEY ? 'DREAM_MEMORY_EMBEDDING_API_KEY' : undefined"
          baseURL: !!js process.env.DREAM_MEMORY_EMBEDDING_BASE_URL
          model: !!js process.env.DREAM_MEMORY_EMBEDDING_MODEL
          dimensions: !!js "process.env.DREAM_MEMORY_EMBEDDING_DIMENSIONS ? Number(process.env.DREAM_MEMORY_EMBEDDING_DIMENSIONS) : undefined"
